# The website assistant's server (assistant-server.anypress.io, Coolify app anypress-assistant). It needs its database to start, so it is only built.
# Builds its image on GitHub and, on main, publishes it and moves release/anypress-assistant (image.yml).
name: Assistant image

on:
  pull_request:
    paths:
      - 'tsconfig.json'
      - 'mcp/skills/**'
      - '.claude/skills/wp-patterns/**'
      - '.claude/skills/wp-block-themes/**'
      - 'agent/Dockerfile'
      - 'agent/package.json'
      - 'agent/package-lock.json'
      - 'agent/tsconfig.json'
      - 'agent/src/**'
      - 'agent/skills/**'
      - '.dockerignore'
      - '.github/workflows/image.yml'
      - '.github/workflows/assistant-image.yml'
  push:
    branches: [main]
    paths:
      - 'tsconfig.json'
      - 'mcp/skills/**'
      - '.claude/skills/wp-patterns/**'
      - '.claude/skills/wp-block-themes/**'
      - 'agent/Dockerfile'
      - 'agent/package.json'
      - 'agent/package-lock.json'
      - 'agent/tsconfig.json'
      - 'agent/src/**'
      - 'agent/skills/**'
      - '.dockerignore'
      - '.github/workflows/image.yml'
      - '.github/workflows/assistant-image.yml'
  workflow_dispatch:

concurrency:
  # A pull request's runs share a group and the newest cancels the rest. Every other run (a main push, a re-run, a
  # manual run) gets its own group, so none can cancel another's publish; image.yml's newest-commit check decides
  # which one moves `latest` and the release branch.
  group: anypress-assistant-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: anypress-assistant
      context: .
      file: agent/Dockerfile
