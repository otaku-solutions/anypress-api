# Builds one of this repository's Coolify apps into a Docker image here, instead of on the server that runs it
# (release/README.md). Called by the app's own workflow (api-image.yml, assistant-image.yml, panel-image.yml,
# playground-image.yml), which starts only when the app's files change. A pull request builds the image and, where
# the app runs without a database, starts it. main also publishes it to GHCR and moves the app's release branch,
# which Coolify deploys from, so the server only downloads an image that already exists.
name: Image

on:
  workflow_call:
    inputs:
      image:
        description: The image's name under ghcr.io/<owner>/ and of its release branch (release/<image>)
        type: string
        required: true
      context:
        description: The build context
        type: string
        required: true
      file:
        description: The Dockerfile
        type: string
        required: true
      check-port:
        description: Start the image and check this port answers; empty for an app that needs its database to start
        type: string
        default: ''
      check-path:
        description: The path the check asks for
        type: string
        default: /

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7
      # Only main's newest commit may move `latest` and the release branch: a re-run of an older commit's workflow
      # keeps that commit's SHA, and would otherwise roll the app back. Every commit still gets its sha- image.
      - name: Is this main's newest commit?
        id: fresh
        if: github.ref == 'refs/heads/main'
        # bash with pipefail: a failed lookup fails the step instead of quietly skipping the release.
        shell: bash
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "newest=false" >> "$GITHUB_OUTPUT"; echo "main is at $tip; not moving latest or the release branch"; fi
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          load: true
          tags: ${{ inputs.image }}:check
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,scope=${{ inputs.image }},mode=max
      - name: Start it and check it answers
        if: inputs.check-port != ''
        env:
          PORT: ${{ inputs.check-port }}
          CHECK_PATH: ${{ inputs.check-path }}
          TAG: ${{ inputs.image }}:check
        run: |
          docker run -d --name app -p "$PORT:$PORT" "$TAG"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT$CHECK_PATH" || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then echo "answered $code"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: Image size
        run: docker image inspect "${{ inputs.image }}:check" --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1 / 1000000 }'
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          # `latest` is main's newest commit; any other run publishes only its commit's tag.
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ steps.fresh.outputs.newest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.image }}
      # Coolify deploys from this branch (release/<image>.Dockerfile), so it only ever picks up a commit whose image
      # is already published.
      - name: Release
        if: github.event_name != 'pull_request' && steps.fresh.outputs.newest == 'true'
        # Checked again here: runs for two main commits can overlap, and the older one may finish last.
        shell: bash
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then echo "main moved on to $tip; leaving the release branch to its run"; exit 0; fi
          git push --force origin "HEAD:refs/heads/release/${{ inputs.image }}"
