# The website assistant's chat panel (every store's /.assistant, Coolify app anypress-assistant-panel).
# Builds its image on GitHub and, on main, publishes it and moves release/anypress-assistant-panel (image.yml).
name: Assistant panel image

on:
  pull_request:
    paths:
      - 'agent/panel/**'
      - '.github/workflows/image.yml'
      - '.github/workflows/panel-image.yml'
  push:
    branches: [main]
    paths:
      - 'agent/panel/**'
      - '.github/workflows/image.yml'
      - '.github/workflows/panel-image.yml'
  workflow_dispatch:

concurrency:
  # A pull request's runs share a group and the newest cancels the rest. Every other run (a main push, a re-run, a
  # manual run) gets its own group, so none can cancel another's publish; image.yml's newest-commit check decides
  # which one moves `latest` and the release branch.
  group: anypress-assistant-panel-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: anypress-assistant-panel
      context: agent/panel
      file: agent/panel/Dockerfile
      check-port: '3200'
      check-path: /.assistant
