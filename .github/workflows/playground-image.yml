# WordPress Playground for demo.anypress.site (Coolify app anypress-demo-playground).
# Builds its image on GitHub and, on main, publishes it and moves release/anypress-demo-playground (image.yml).
name: Demo playground image

on:
  pull_request:
    paths:
      - 'playground/**'
      - '.github/workflows/image.yml'
      - '.github/workflows/playground-image.yml'
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - '.github/workflows/image.yml'
      - '.github/workflows/playground-image.yml'
  workflow_dispatch:

concurrency:
  # A pull request's runs share a group and the newest cancels the rest. Every other run (a main push, a re-run, a
  # manual run) gets its own group, so none can cancel another's publish; image.yml's newest-commit check decides
  # which one moves `latest` and the release branch.
  group: anypress-demo-playground-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: anypress-demo-playground
      context: playground
      file: playground/Dockerfile
      check-port: '80'
      check-path: /
