# Publishes sdk/typescript to npm as waas-provisioning-sdk when a tag like sdk-ts-v0.1.0 is pushed.
# Uses npm Trusted Publishing (GitHub's OIDC token), so no npm token is stored. Steps for maintainers: docs/publishing.md.
name: Release TypeScript SDK

on:
  push:
    tags: ['sdk-ts-v*']
  # Or run it by hand on main: releases the version in package.json.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag (or branch, when run by hand) matches package.json
        working-directory: sdk/typescript
        run: |
          expected="sdk-ts-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run it by hand on main only (got $GITHUB_REF)"
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json (expected $expected)"
            exit 1
          fi
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run sdk:check
      - name: Publish
        working-directory: sdk/typescript
        run: npm publish --provenance --access public
